name: 앱 만들기 (APK)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: arpg-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: |
            src/town/.enc_cache
            src/town/.ground_cache.png
            src/town/.ground_out_cache.png
          key: town-build-${{ runner.os }}-${{ hashFiles('src/town/build.py', 'src/town/outmap.py', 'assets/**') }}
          restore-keys: |
            town-build-${{ runner.os }}-
      - name: 앱 안의 예비판도 최신 설정으로 만들기
        run: |
          pip install pillow numpy scipy
          python src/town/build.py
      - name: 앱 만들기
        run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: 받기 페이지에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 판타지 워크숍 앱 (최신)
          body: 판타지 워크숍 개발판입니다. 이 페이지의 sandrock.apk 를 폰·패드에서 눌러 받아 설치하세요. 다음부터는 지우지 말고 덮어 설치하면 저장이 그대로 남습니다. 게임 내용은 앱을 켤 때 자동으로 최신이 됩니다.
          make_latest: true
          files: android/app/build/outputs/apk/debug/sandrock.apk
