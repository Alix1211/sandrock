name: field-screenshots
on:
  push:
    branches: [main]
    paths:
      - 'src/town/capture_fields.py'
      - '.github/workflows/field-screenshots.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python src/town/capture_fields.py
      - uses: actions/upload-artifact@v4
        with:
          name: field-screenshots
          path: field_shots/*.png
          if-no-files-found: error
