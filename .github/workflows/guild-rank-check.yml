name: guild-rank-check
on:
  push:
    branches: [main]
    paths:
      - 'src/town/guild.js'
      - 'src/town/shell.html'
      - 'src/town/town.js'
      - 'src/town/field_dungeon.js'
      - 'src/town/check_guild.py'
      - 'src/town/check_guild_rank.py'
      - '.github/workflows/guild-rank-check.yml'

jobs:
  guild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install pillow numpy scipy playwright
          python -m playwright install --with-deps chromium
      - run: |
          for f in src/town/*.js; do node --check "$f"; done
          python src/town/build.py
          python src/town/check_guild.py
          python src/town/check_guild_rank.py
