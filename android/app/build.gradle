plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alix.arpg'
    compileSdk 37

    // 어디서 만들든 같은 서명 → 지우지 않고 덮어 설치(업데이트) 가능
    signingConfigs {
        arpg {
            storeFile rootProject.file('arpg.keystore')
            storePassword 'arpg1234'
            keyAlias 'arpg'
            keyPassword 'arpg1234'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.arpg }
    }

    defaultConfig {
        applicationId 'com.alix.sandrock'
        minSdk 26
        targetSdk 35
        versionCode ((int) (System.currentTimeMillis() / 60000L - 29000000L))   // 만든 시각 기준: 새로 만든 것이 항상 더 큼
        versionName '1.0'
    }

    sourceSets.main.assets.srcDir(file('build/generated/webAssets'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// 인터넷이 안 될 때 쓸 예비 판: 빌드할 때 game/town.html 과 그림 파일(art_*.js)을 앱 안에 넣는다.
def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../game')) { include 'town.html', 'art_*.js' }
    into(layout.buildDirectory.dir('generated/webAssets/game'))
}
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn(syncWebAssets)
}

// 만들어진 앱 파일 이름을 sandrock.apk 로도 복사
tasks.configureEach { t ->
    if (t.name == 'assembleDebug') t.doLast {
        def d = layout.buildDirectory.dir('outputs/apk/debug').get().asFile
        def a = new File(d, 'app-debug.apk')
        if (a.exists()) java.nio.file.Files.copy(a.toPath(), new File(d, 'sandrock.apk').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
