<title>지하 던전 시험장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면짜리 게임: 어두운 던전을 캔버스 전체에, 조작 UI는 반투명으로 얹음. 지하 분위기 하나로 고정(단일 테마). */
:root{
  --ground:#120f0d;
  --ui:rgba(24,20,18,.7);
  --ui-line:rgba(255,236,210,.28);
  --ui-text:#fbefdc;
  --accent:#ffbf5a;
  --hp:#ff7d8c;
  --boss:#7dffb0;
  --font-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;font-family:var(--font-ui);color:var(--ui-text)}
.orbs{display:flex;align-items:center;gap:2px}
.orb{position:relative;width:78px;height:68px;flex:none}
.orb img{position:absolute;inset:0;width:100%;height:100%}
.orb .fill{transition:clip-path .25s}
.orb span{position:absolute;left:0;right:12%;top:30%;text-align:center;font-size:16px;color:#fff;
  text-shadow:0 1px 2px #000,0 0 4px #000;font-variant-numeric:tabular-nums}
.meta{margin-left:6px;font-size:14px;line-height:1.3;text-shadow:0 1px 3px #000}
.meta small{display:block;font-size:12px;opacity:.85}
.view{pointer-events:auto;background:var(--ui);border:1px solid var(--ui-line);color:var(--ui-text);border-radius:12px;
  font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
.view:focus-visible{outline:3px solid var(--accent)}
#boss{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 86px);width:min(72vw,340px);
  font-family:var(--font-ui);color:var(--boss);text-align:center;font-size:15px;pointer-events:none}
#boss .bar{height:9px;margin-top:4px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(125,255,176,.35)}
#boss .bar i{display:block;height:100%;width:100%;background:var(--boss);transition:width .2s}
.pads{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:flex-end;gap:12px;font-family:var(--font-ui)}
.btn{position:relative;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;touch-action:none}
.btn img{width:100%;height:100%;display:block;pointer-events:none}
.btn.big{width:90px;height:90px}
.btn.on{transform:scale(.92)}
.btn .cd{position:absolute;inset:9%;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(10,6,10,.72) calc(var(--cd,0)*1turn),transparent 0)}
.btn.nomp img{filter:grayscale(.85) brightness(.7)}
.btn small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:12px;color:var(--ui-text);text-shadow:0 1px 2px #000}
.pads .col{display:flex;flex-direction:column;gap:22px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#hint{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 82px);max-width:min(calc(100% - 32px),320px);font-family:var(--font-ui);
  color:var(--ui-text);background:var(--ui);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.45;transition:opacity .6s;pointer-events:none}
#msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;font-family:var(--font-ui);width:max-content;max-width:calc(100% - 32px);
  color:var(--ui-text);background:var(--ui);border:1px solid var(--ui-line);border-radius:14px;padding:16px 24px;font-size:22px;line-height:1.35}
#msg small{display:block;font-size:14px;opacity:.85;margin-top:4px}
#msg button{margin-top:12px;font:inherit;font-size:16px;padding:8px 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<canvas id="game" aria-label="던전 지도, 캐릭터를 움직여 탐험하고 몬스터와 싸울 수 있음"></canvas>
<div class="hud">
  <div class="orbs">
    <div class="orb" role="img" aria-label="체력"><img id="hpBase" alt=""><img id="hpFill" class="fill" alt=""><span id="hpTxt">10</span></div>
    <div class="orb" role="img" aria-label="마나"><img id="mpBase" alt=""><img id="mpFill" class="fill" alt=""><span id="mpTxt">10</span></div>
    <div class="meta">지하 던전 1층<small id="info">처치 0</small></div>
  </div>
  <button class="view" id="zoom" type="button">시야: 보통</button>
</div>
<div id="boss" hidden>리치<div class="bar"><i id="bossFill"></i></div></div>
<div id="hint">스위치를 밟으면 보스 방 철창이 열려요<br>항아리와 상자는 공격으로 열어요<br>PC: WASD 이동, 스페이스 공격, Shift 대시, E 불덩이</div>
<div id="msg" hidden></div>
<div class="pads">
  <div class="col">
    <button class="btn" id="bSkill" type="button" aria-label="불덩이 (마나 3)"><img id="iSkill" alt=""><i class="cd" id="cdSkill"></i><small>불덩이</small></button>
    <button class="btn" id="bDash" type="button" aria-label="대시"><img id="iDash" alt=""><i class="cd" id="cdDash"></i><small>대시</small></button>
  </div>
  <button class="btn big" id="bAtk" type="button" aria-label="공격"><img id="iAtk" alt=""></button>
</div>

}
function drawHeart(x, y, s){
  ctx.fillStyle = '#ff5f78'; ctx.strokeStyle = 'rgba(40,10,14,.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y - s * 0.3, x - s * 0.45, y - s, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s, x + s, y - s * 0.3, x, y + s * 0.35);
  ctx.fill(); ctx.stroke();
}
function draw(t){
  const z = Math.max(0.9, Math.min(1.7, Math.min(vw, vh) / (8.5 * TS))) * ZOOMS[zi][1];
  ctx.setTransform(dpr * z, 0, 0, dpr * z, 0, 0); ctx.imageSmoothingQuality = 'high';
  const sw = vw / z, sh = vh / z;
  let cx = P.x - sw / 2, cy = P.y - TS * 0.8 - sh / 2;
  cx = Math.max(0, Math.min(MW * TS - sw, cx)); cy = Math.max(0, Math.min(MH * TS - sh, cy));
  if (sw > MW * TS) cx = (MW * TS - sw) / 2; if (sh > MH * TS) cy = (MH * TS - sh) / 2;
  if (shake > 0){ cx += (Math.random() - 0.5) * 10 * shake / 0.25; cy += (Math.random() - 0.5) * 10 * shake / 0.25; }
  ctx.fillStyle = '#120f0d'; ctx.fillRect(0, 0, sw, sh);
  const ox = Math.round(cx * z) / z, oy = Math.round(cy * z) / z;
  ctx.translate(-ox, -oy);
  const x0 = Math.max(0, Math.floor(cx / TS)), x1 = Math.min(MW - 1, Math.floor((cx + sw) / TS));
  const y0 = Math.max(0, Math.floor(cy / TS)), y1 = Math.min(MH - 1, Math.floor((cy + sh) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    const k = look[y][x]; if (!k) continue;
    const im = tImg[k]; if (im.complete) ctx.drawImage(im, x * TS, y * TS, TS + 0.6, TS + 0.6);
    const c = map[y][x];
    if (c === 'G' && !gatesOpen){ const g = pImg.gate, o = DP.gate; if (g.complete) ctx.drawImage(g, x * TS + TS / 2 - TS * 0.55, (y + 1) * TS - o.h * (TS * 1.1 / o.w) , TS * 1.1, o.h * (TS * 1.1 / o.w)); }
    if (c === 'G' && gatesOpen){ const d = tImg.door_open; if (d.complete) ctx.drawImage(d, x * TS, y * TS, TS + 0.6, TS + 0.6); }
  }
  // 바닥 장식, 함정, 스위치, 벽 횃불
  for (const p of props) if (p.flat){
    const o = p.o, im = pImg[p.name]; if (!im.complete) continue;
    if (p.web) ctx.drawImage(im, p.x + TS / 2 - o.w, p.y - TS * 0.86, o.w, o.h);
    else ctx.drawImage(im, p.x - o.w / 2, p.y - o.h * 0.8, o.w, o.h);
  }
  for (const tr of traps){ const k = trapUp(tr, gameT) ? 'spike_up' : 'spike_down', o = DP[k], im = pImg[k]; if (im.complete) ctx.drawImage(im, tr.tx * TS + (TS - o.w) / 2, tr.ty * TS + (TS - o.h) / 2, o.w, o.h); }
  if (switchTile){ const k = gatesOpen ? 'switch_down' : 'switch_up', o = DP[k], im = pImg[k]; if (im.complete) ctx.drawImage(im, switchTile.tx * TS + (TS - o.w) / 2, switchTile.ty * TS + (TS - o.h) / 2, o.w, o.h); }
  for (const tc of torches){ const o = DP.torch, im = pImg.torch; if (im.complete) ctx.drawImage(im, tc.x - o.w / 2, tc.y - o.h * 0.75, o.w, o.h); }
  for (const pk of pickups) if (!pk.got) drawHeart(pk.x, pk.y - 10 - Math.abs(Math.sin(pk.t * 4)) * 4, 9);

  // 깊이 순서대로 세워진 것들
  const list = [];
  for (const p of props) if (!p.flat && !p.gone) list.push({ y: p.y, p });
  for (const m of mons) if (!m.dead) list.push({ y: m.y, m });
  list.push({ y: P.y, me: true });
  list.sort((a, b) => a.y - b.y);
  const frameNo = P.moving && P.dashT < 0 ? 1 + (Math.floor(P.anim) % 4) : (P.dashT >= 0 ? 2 : 0);
  const bob = P.moving ? 0 : Math.sin(t * 2.2) * 1.2;
  for (const it of list){
    if (it.me){
      if (P.dead > 0){ drawElf(P.x, P.y, 'front', 1, 0, Math.max(0, P.dead - 1.4)); continue; }
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(P.x, P.y, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
      P.trail.forEach((g, i) => drawElf(g.x, g.y, g.dir, g.face, 2, 0.12 + i * 0.04));
      let ox2 = 0, oy2 = 0;
      if (P.atkT >= 0){ const [vx, vy] = dirVec(); const k = Math.sin(Math.min(1, P.atkT / 0.14) * Math.PI) * 7; ox2 = vx * k; oy2 = vy * k; }
      drawElf(P.x + ox2, P.y + oy2 - bob, P.dir, P.face, frameNo, P.inv > 0 && Math.floor(P.inv * 16) % 2 ? 0.35 : 1);
      drawSlash();
    } else if (it.m) drawMon(it.m);
    else { const p = it.p, o = p.o, im = pImg[p.name]; if (im.complete) ctx.drawImage(im, p.x - o.w / 2, p.y - o.h + 4, o.w, o.h); }
  }
  for (const s of pshots){
    ctx.fillStyle = '#ff7a2a'; ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(s.x, s.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffe28a'; ctx.beginPath(); ctx.arc(s.x, s.y, 6.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const s of shots){
    ctx.fillStyle = s.col; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(s.x, s.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const f of fx){ ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;

  // 어둠과 빛
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = 'source-over'; dctx.fillStyle = 'rgba(8,5,12,0.8)'; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.globalCompositeOperation = 'destination-out';
  const k = dpr * z;
  const light = (wx, wy, r, a) => {
    const sx = (wx - ox) * k, sy = (wy - oy) * k, rr = r * TS * k;
    if (sx < -rr || sy < -rr || sx > dark.width + rr || sy > dark.height + rr) return;
    const g = dctx.createRadialGradient(sx, sy, 0, sx, sy, rr);
    g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(0.55, 'rgba(0,0,0,' + a * 0.6 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.fillRect(sx - rr, sy - rr, rr * 2, rr * 2);
  };
  light(P.x, P.y - TS * 0.5, 4.6, 1);
  for (const tc of torches) light(tc.x, tc.y - 10, 2.3 + Math.sin(t * 9 + tc.x) * 0.08, 0.85);
  for (const lv of lavaLights) light(lv.x, lv.y, 1.4, 0.6);
  for (const s of shots) light(s.x, s.y, 1.0, 0.7);
  for (const s of pshots) light(s.x, s.y, 1.8, 0.9);
  for (const m of mons) if (!m.dead && m.d.shoot) light(m.x, m.y - TS * 0.7, 1.2, 0.5);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0);

  // 숫자 글씨는 어둠 위에
  ctx.setTransform(dpr * z, 0, 0, dpr * z, 0, 0); ctx.translate(-ox, -oy);
  ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,14,10,.9)';
  for (const tx of texts){
    ctx.globalAlpha = Math.min(1, tx.life / 0.4); ctx.font = (tx.big ? '19px ' : '16px ') + FONT;
    ctx.strokeText(tx.txt, tx.x, tx.y); ctx.fillStyle = tx.col; ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  if (joy.id !== null){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ring = uiImg.joystick_ring, knob = uiImg.joystick_knob, R0 = 66;
    ctx.globalAlpha = 0.75;
    if (ring.complete) ctx.drawImage(ring, joy.ox - R0, joy.oy - R0 * 0.97, R0 * 2, R0 * 1.94);
    ctx.globalAlpha = 0.95;
    if (knob.complete) ctx.drawImage(knob, joy.ox + joy.dx * 44 - 30, joy.oy + joy.dy * 44 - 30, 60, 60);
    ctx.globalAlpha = 1;
  }
}

// ---------- HUD ----------
const hpFill = document.getElementById('hpFill'), mpFill = document.getElementById('mpFill'), infoEl = document.getElementById('info');
const hpTxt = document.getElementById('hpTxt'), mpTxt = document.getElementById('mpTxt');
const cdSkill = document.getElementById('cdSkill'), cdDash = document.getElementById('cdDash'), bSkill = document.getElementById('bSkill');
const orbClip = f => 'inset(' + (16 + (1 - f) * 70).toFixed(1) + '% 0 0 0)';
const bossEl = document.getElementById('boss'), bossFill = document.getElementById('bossFill');
let lastInfo = '', lastBossShown = null;
function hud(){
  const hf = P.hp / P.maxHp, mf = P.mp / P.maxMp;
  hpFill.style.clipPath = hf >= 1 ? 'none' : orbClip(hf); mpFill.style.clipPath = mf >= 0.999 ? 'none' : orbClip(mf);
  hpTxt.textContent = P.hp; mpTxt.textContent = Math.floor(P.mp);
  cdSkill.style.setProperty('--cd', (P.skillCd / 0.6).toFixed(3)); cdDash.style.setProperty('--cd', (P.dashCd / 0.8).toFixed(3));
  bSkill.classList.toggle('nomp', P.mp < 3);
  const s = '처치 ' + kills; if (s !== lastInfo){ infoEl.textContent = s; lastInfo = s; }
  const show = !!lich && !lich.dead && Math.hypot(lich.x - P.x, lich.y - P.y) < 9 * TS;
  if (show !== lastBossShown){ bossEl.hidden = !show; lastBossShown = show; }
  if (show) bossFill.style.width = Math.max(0, lich.hp / lich.d.hp * 100) + '%';
}
let last = performance.now();
function loop(now){ const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(now / 1000); hud(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
