<title>봄 들판 시험장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면짜리 게임: 캔버스가 화면 전체, 조작 UI는 위에 반투명으로 얹음. 낮 들판 하나의 분위기로 고정(단일 테마). */
:root{
  --ground:#6fbf4a;
  --ui:rgba(38,30,22,.62);
  --ui-line:rgba(255,246,228,.35);
  --ui-text:#fff6e4;
  --accent:#ffd36a;
  --hp:#ff7d8c;
  --font-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;font-family:var(--font-ui);color:var(--ui-text)}
.tag{background:var(--ui);border:1px solid var(--ui-line);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.35;pointer-events:auto}
.tag small{display:block;font-size:12px;opacity:.8}
.pads{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:flex-end;
  gap:12px;font-family:var(--font-ui)}
.btn{width:68px;height:68px;border-radius:50%;border:2px solid var(--ui-line);background:var(--ui);color:var(--ui-text);
  font:inherit;font-size:17px;display:grid;place-items:center;cursor:pointer;touch-action:none}
.btn.big{width:84px;height:84px;font-size:19px;border-color:var(--accent);color:var(--accent)}
.btn:active,.btn.on{transform:scale(.94);background:rgba(38,30,22,.82)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{pointer-events:auto;background:var(--ui);border:1px solid var(--ui-line);color:var(--ui-text);border-radius:12px;
  font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
.view:focus-visible{outline:3px solid var(--accent)}
#hint{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 74px);max-width:min(70%,320px);font-family:var(--font-ui);
  color:var(--ui-text);background:var(--ui);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.4;transition:opacity .6s;pointer-events:none}
.hp{width:132px;height:8px;margin:6px 0 4px;border-radius:4px;background:rgba(255,246,228,.22);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--hp);transition:width .2s}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-family:var(--font-ui);
  color:var(--ui-text);background:var(--ui);border:1px solid var(--ui-line);border-radius:14px;padding:14px 22px;font-size:22px;line-height:1.3}
#msg small{font-size:14px;opacity:.85}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<canvas id="game" aria-label="캐릭터를 움직여 볼 수 있는 들판 지도"></canvas>
<div class="hud">
  <div class="tag">봄 들판 시험장
    <div class="hp" role="img" aria-label="체력"><i id="hpFill"></i></div>
    <small id="info">체력 10/10 · 처치 0</small>
  </div>
  <button class="view" id="zoom" type="button">시야: 보통</button>
</div>
<div id="hint">화면을 누른 채 끌면 걸어요 · 공격과 대시는 오른쪽 버튼<br>PC: 방향키·WASD 이동, 스페이스 공격, Shift 대시</div>
<div id="msg" hidden>쓰러졌어요<br><small>잠시 후 정원에서 다시 시작해요</small></div>
<div class="pads">
  <button class="btn" id="bDash" type="button">대시</button>
  <button class="btn big" id="bAtk" type="button">공격</button>
</div>

(function(){

// ---------- 이미지 불러오기 ----------

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ROAD = 13;                     // 흙길: 13줄(위 경계) + 14줄(아래 경계)
const map = [];
for (let y = 0; y < MH; y++){ const row = []; for (let x = 0; x < MW; x++){
  let t = 'grass'; rnd();
  if (y === ROAD) t = 'road_top'; else if (y === ROAD + 1) t = 'road_bot';
  else if (x === 18 && y >= 3 && y < ROAD) t = 'path';
  else if (x === 9 && y > ROAD + 1 && y < 25) t = 'path';
  row.push(t);
} map.push(row); }

const objects = [];
const taken = new Set();
function place(name, tx, ty, jitter = true){
  const key = tx + ',' + ty; if (taken.has(key)) return;
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return;
  if (!(map[ty][tx] === 'grass' || map[ty][tx] === 'flower')) return;
  if (Math.abs(tx - 18) <= 1 && Math.abs(ty - 18) <= 1) return;   // 시작 위치 비워 두기
  taken.add(key);
  const o = OBJS[name];
  objects.push({ name, x: (tx + 0.5) * TS + (jitter ? (rnd() - 0.5) * 14 : 0), y: (ty + 0.82) * TS, o });
}
const TH = ['spring','summer','autumn'];
// 시작 지점 앞 작은 정원
place('g_stepping', 18, 15, false); place('g_stepping', 18, 16, false);
place('g_lantern', 16, 16, false); place('g_lantern', 20, 16, false);

place('g_fountain', 22, 18, false); place('g_windmill', 25, 16, false);
place('g_pot_tulip', 16, 20, false); place('g_can_flower', 14, 20, false);
place('g_barrel_flower', 20, 21, false); place('g_butterfly', 17, 22, false); place('g_rabbit', 22, 21, false);
for (let x = 13; x <= 23; x++) place('g_picket', x, 24, false);
// 지도 가장자리 숲
for (let x = 0; x < MW; x++){ for (const y of [0, MH - 1]) place(TH[(rnd()*2)|0] + (rnd() < .6 ? '_tree_big' : '_tree_small'), x, y); }
for (let y = 1; y < MH - 1; y++){ for (const x of [0, MW - 1]) if (y !== ROAD && y !== ROAD + 1) place(TH[(rnd()*2)|0] + (rnd() < .6 ? '_tree_big' : '_tree_small'), x, y); }
// 돌길 옆 울타리와 표지판
for (let y = 4; y < ROAD - 1; y += 1) place('spring_fence_h', 16, y, false);
place('spring_sign', 19, ROAD - 1, false); place('spring_sign', 10, ROAD + 2, false);
place('spring_crate', 20, 4); place('spring_crate', 21, 4); place('summer_crate', 20, 5);
// 숲 덩어리
const clusters = [[5,5,'spring'],[28,6,'summer'],[25,20,'autumn'],[4,20,'summer'],[30,24,'spring']];
for (const [cx, cy, th] of clusters){
  for (let i = 0; i < 9; i++){
    const tx = cx + Math.round((rnd() - .5) * 6), ty = cy + Math.round((rnd() - .5) * 5);
    const r = rnd();
    place(th + (r < .35 ? '_tree_big' : r < .55 ? '_tree_small' : r < .75 ? '_bush' : r < .88 ? '_rock_big' : '_flowers'), tx, ty);
  }
}
// 들판에 흩어진 소품
const props = ['_rock_small','_stump','_flowers','_bush','_rock_big','_flowers'];
for (let i = 0; i < 46; i++){
  const tx = 2 + ((rnd() * (MW - 4)) | 0), ty = 2 + ((rnd() * (MH - 4)) | 0);
  place(TH[(rnd()*3)|0] + props[(rnd()*props.length)|0], tx, ty);
}

// 충돌 상자
function boxOf(ob){
  const o = ob.o; if (!o.cw) return null;
  const w = o.w * o.cw, h = o.ch * TS;
  return { l: ob.x - w / 2, r: ob.x + w / 2, t: ob.y - h, b: ob.y };
}
const colliders = objects.map(boxOf).filter(Boolean);

hot?.snapshot?.(() => ({ x: P.x, y: P.y, kills }));

function hitsR(x, y, r){
  if (x - r < TS * 0.6 || y - r < TS * 0.9 || x + r > (MW - 0.6) * TS || y + 4 > (MH - 0.4) * TS) return true;
  for (const c of colliders){
    if (x + r > c.l && x - r < c.r && y + 4 > c.t && y - 4 < c.b) return true;
  }
  return false;
}
function tryMove(e, dx, dy, r){
  if (!hitsR(e.x + dx, e.y, r)) e.x += dx;
  if (!hitsR(e.x, e.y + dy, r)) e.y += dy;
}

function freeSpot(x0, y0, x1, y1, r){

  }
}

function hurtPlayer(dmg, nx, ny){
  P.hp = Math.max(0, P.hp - dmg); P.inv = 1.0;
  P.kx = nx * 7 * TS; P.ky = ny * 7 * TS; shake = 0.25;
  popText(P.x, P.y - TS * 1.8, '-' + dmg, '#ff5a6a');
  if (P.hp <= 0){ P.dead = 2.2; P.atkT = -1; P.dashT = -1; poof(P.x, P.y - TS * 0.8, '#ffd0d6', 18); }
}
function hurtMon(m, dmg, crit){
  m.hp -= dmg; m.hitT = 0.28; m.state = 'chase';
  const dx = m.x - P.x, dy = m.y - P.y, l = Math.hypot(dx, dy) || 1, kb = m.d.boss ? 2 : 6;
  m.kx = dx / l * kb * TS; m.ky = dy / l * kb * TS;
  popText(m.x, m.y - MONS[m.type].h - 6, (crit ? '치명! ' : '') + dmg, crit ? '#ffd34d' : '#ffffff', crit);
  poof(m.x, m.y - MONS[m.type].h * 0.5, 'rgba(255,255,255,.9)', 5);
  if (m.hp <= 0){
    m.dead = true; m.respawn = m.d.boss ? 30 : 10; kills++;
    poof(m.x, m.y - MONS[m.type].h * 0.45, m.type.includes('slime') ? '#8be07a' : '#e8d6b0', m.d.boss ? 34 : 16);
    if (m.d.boss) popText(m.x, m.y - MONS[m.type].h - 30, '슬라임 킹 처치!', '#ffd34d', true);
  }
}

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (e.repeat && (k === ' ' || k === 'j')) return;
  keys[k] = true;
  if (k === ' ' || k === 'j'){ attack(); e.preventDefault(); }
  if (k === 'shift' || k === 'k') dash();
  if (k.startsWith('arrow')) e.preventDefault();
  firstUse();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const joy = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', e => {
  if (joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
  cv.setPointerCapture(e.pointerId); firstUse();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy), m = 56;
  if (d > m){ dx *= m / d; dy *= m / d; }
  joy.dx = dx / m; joy.dy = dy / m;
});
const endJoy = e => { if (e.pointerId === joy.id){ joy.id = null; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);

function dirVec(){ return P.dir === 'front' ? [0, 1] : P.dir === 'back' ? [0, -1] : [P.face, 0]; }
function attack(){
  if (P.dead > 0 || P.atkCd > 0 || P.dashT >= 0) return;
  P.atkT = 0; P.atkHit = false; P.atkCd = 0.34;
}
function dash(){
  if (P.dead > 0 || P.dashCd > 0) return;
  let [vx, vy] = [P.dx, P.dy]; if (!vx && !vy) [vx, vy] = dirVec();
  const l = Math.hypot(vx, vy) || 1; P.dashX = vx / l; P.dashY = vy / l;
  P.dashT = 0; P.dashCd = 0.8; P.trail = []; P.atkT = -1;
}
function bindBtn(id, fn){
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); fn(); firstUse(); });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off);
  b.addEventListener('keydown', e => { if (e.key === 'Enter') fn(); });
}
bindBtn('bAtk', attack); bindBtn('bDash', dash);

let used = false;
function firstUse(){ if (used) return; used = true; setTimeout(() => document.getElementById('hint').style.opacity = 0, 3000); }

const ZOOMS = [['멀리', 0.8], ['보통', 1], ['가까이', 1.35]]; let zi = 1;
document.getElementById('zoom').addEventListener('click', () => {
  zi = (zi + 1) % ZOOMS.length; document.getElementById('zoom').textContent = '시야: ' + ZOOMS[zi][0];
});

// ---------- 화면 크기 ----------
let vw = 0, vh = 0, dpr = 1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
}
addEventListener('resize', resize); resize();

// ---------- 갱신 ----------
function decay(e, dt){
  if (!e.kx && !e.ky) return;
  const f = Math.pow(0.002, dt); e.kx *= f; e.ky *= f;
  if (Math.hypot(e.kx, e.ky) < 8) e.kx = e.ky = 0;
}
function update(dt){
  // 쓰러짐 → 정원에서 다시 시작
  if (P.dead > 0){
    P.dead -= dt;
    if (P.dead <= 0){ P.x = START.x; P.y = START.y; P.hp = P.maxHp; P.inv = 1.5; P.kx = P.ky = 0; P.dir = 'front'; }
  }
  const alive = P.dead <= 0;
  P.inv = Math.max(0, P.inv - dt); P.atkCd = Math.max(0, P.atkCd - dt); P.dashCd = Math.max(0, P.dashCd - dt);

  let ix = 0, iy = 0;
  if (keys['arrowleft'] || keys['a']) ix -= 1; if (keys['arrowright'] || keys['d']) ix += 1;
  if (keys['arrowup'] || keys['w']) iy -= 1;   if (keys['arrowdown'] || keys['s']) iy += 1;
  if (ix || iy){ const l = Math.hypot(ix, iy); ix /= l; iy /= l; }
  else { ix = joy.dx; iy = joy.dy; if (Math.hypot(ix, iy) < 0.18){ ix = iy = 0; } }
  if (!alive){ ix = iy = 0; }
  const mag = Math.min(1, Math.hypot(ix, iy));
  P.dx = ix; P.dy = iy;

  if (P.dashT >= 0){
    P.dashT += dt; P.trail.push({ x: P.x, y: P.y, dir: P.dir, face: P.face });
    if (P.trail.length > 6) P.trail.shift();
    tryMove(P, P.dashX * 11 * TS * dt, P.dashY * 11 * TS * dt, R);
    if (P.dashT > 0.17){ P.dashT = -1; P.inv = Math.max(P.inv, 0.15); }
    P.moving = true;
  } else {
    P.moving = mag > 0;
    if (P.moving){
      const sp = SPEED * (P.atkT >= 0 ? 0.35 : 1);
      tryMove(P, ix * sp * dt, iy * sp * dt, R);
      if (P.atkT < 0){
        if (Math.abs(iy) > Math.abs(ix) * 1.1) P.dir = iy > 0 ? 'front' : 'back';
        else { P.dir = 'side'; P.face = ix < 0 ? -1 : 1; }
      }
      P.anim += dt * (6 + 5 * mag);
    } else P.anim = 0;
  }
  if (P.kx || P.ky){ tryMove(P, P.kx * dt, P.ky * dt, R); decay(P, dt); }
  if (P.dashT < 0 && P.trail.length) P.trail.shift();

  // 공격 판정
  if (P.atkT >= 0){
    P.atkT += dt;
    if (!P.atkHit && P.atkT > 0.06){
      P.atkHit = true;
      const [vx, vy] = dirVec();
      const hx = P.x + vx * TS * 0.85, hy = P.y - TS * 0.45 + vy * TS * 0.85;
      for (const m of mons){
        if (m.dead) continue;
        const my = m.y - MONS[m.type].h * 0.45;
        if (Math.hypot(m.x - hx, my - hy) < TS * 0.85 + m.d.r * 0.7){
          const crit = Math.random() < 0.2; hurtMon(m, crit ? 2 : 1, crit);
        }
      }
    }
    if (P.atkT > 0.26) P.atkT = -1;
  }

  // 몬스터
  for (const m of mons){
    if (m.dead){ m.respawn -= dt; if (m.respawn <= 0){ m.dead = false; m.hp = m.d.hp; m.x = m.hx; m.y = m.hy; m.state = 'wander'; poof(m.x, m.y - 10, 'rgba(255,255,255,.8)', 8); } continue; }
    m.anim += dt; if (m.hitT > 0) m.hitT -= dt;
    if (m.kx || m.ky){ tryMove(m, m.kx * dt, m.ky * dt, Math.min(m.d.r, 16)); decay(m, dt); }
    const dx = P.x - m.x, dy = P.y - m.y, dist = Math.hypot(dx, dy) || 1;
    const fromHome = Math.hypot(m.x - m.hx, m.y - m.hy);
    if (m.state === 'chase'){ if (!alive || dist > (m.d.sight + 3) * TS || fromHome > 9 * TS) m.state = 'return'; }
    else if (alive && dist < m.d.sight * TS && Math.hypot(P.x - START.x, P.y - START.y) > 5 * TS) m.state = 'chase';
    let mx = 0, my = 0, sp = m.d.spd * TS;
    if (m.state === 'chase'){ mx = dx / dist; my = dy / dist; }
    else if (m.state === 'return'){
      const hx = m.hx - m.x, hy = m.hy - m.y, h = Math.hypot(hx, hy);
      if (h < TS * 0.5) m.state = 'wander'; else { mx = hx / h; my = hy / h; }
    } else {
      m.t -= dt;
      if (m.t <= 0){
        if (Math.random() < 0.45){ m.wx = m.wy = 0; } else { const a = Math.random() * Math.PI * 2; m.wx = Math.cos(a); m.wy = Math.sin(a); }
        m.t = 0.8 + Math.random() * 1.6;
      }
      mx = m.wx; my = m.wy; sp *= 0.45;
    }
    if (m.hitT > 0 || m.cool > 0) sp = 0;
    if (m.cool > 0) m.cool -= dt;
    if (m.d.kind === 'slime'){ const ph = (m.anim * 1.6) % 1; sp = ph < 0.55 ? sp * 1.6 : 0; }
    m.mx = mx; m.my = my;
    if ((mx || my) && sp > 0){
      tryMove(m, mx * sp * dt, my * sp * dt, Math.min(m.d.r, 16));
      if (Math.abs(mx) > 0.15) m.face = mx < 0 ? -1 : 1;
      m.moving = true;
    } else m.moving = false;
    if (alive && P.inv <= 0 && P.dashT < 0 && dist < m.d.r + R + 6){ hurtPlayer(m.d.dmg, dx / dist, dy / dist); m.cool = 0.9; }
  }
  // 몬스터끼리 겹치지 않게
  for (let i = 0; i < mons.length; i++) for (let j = i + 1; j < mons.length; j++){
    const a = mons[i], b = mons[j]; if (a.dead || b.dead) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.d.r + b.d.r;
    if (d > 0 && d < min){ const p = (min - d) / 2 / d; tryMove(a, -dx * p, -dy * p, 12); tryMove(b, dx * p, dy * p, 12); }
  }
  for (const f of fx){ f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 6 * TS * dt; }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  for (const t of texts){ t.life -= dt; t.y -= TS * 1.1 * dt; }
  for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  shake = Math.max(0, shake - dt);
}

// ---------- 그리기 ----------
function drawElf(x, y, dir, face, frameNo, lift, alpha){
  const C = ELF;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(x, y - lift);
  if (dir === 'side') ctx.scale(face, 1);
  const im = elfImg[dir][frameNo]; if (im.complete) ctx.drawImage(im, -C.w / 2, -C.h + 5, C.w, C.h);
  ctx.restore();
}
function drawMon(m, t){
  const d = m.d;
  let key = m.type;
  if (d.angry && m.state === 'chase') key = d.angry;
  if (d.side && m.moving && Math.abs(m.mx) > Math.abs(m.my)) key = d.side;
  const S = MONS[key], im = monImg[key];
  let sx = 1, sy = 1, lift = 0, rot = 0;
  if (d.kind === 'slime'){
    const ph = (m.anim * 1.6) % 1;
    if (ph < 0.55){ const k = Math.sin(ph / 0.55 * Math.PI); lift = k * (d.boss ? 16 : 9); sy = 1 + 0.08 * k; sx = 1 - 0.06 * k; }
    else { const k = Math.sin((ph - 0.55) / 0.45 * Math.PI); sy = 1 - 0.12 * k; sx = 1 + 0.12 * k; }
  } else if (m.moving){
    const sp = d.kind === 'skitter' ? 22 : 11;
    lift = Math.abs(Math.sin(m.anim * sp)) * 3; rot = Math.sin(m.anim * sp) * 0.06;
  } else { sy = 1 + Math.sin(m.anim * 2.4) * 0.02; }
  // 그림자
  ctx.fillStyle = 'rgba(30,40,20,.26)';
  ctx.beginPath(); ctx.ellipse(m.x, m.y, S.w * 0.36 * (1 - lift / 60), S.w * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  if (m.hitT > 0 && Math.floor(m.hitT * 30) % 2) ctx.globalAlpha = 0.35;
  ctx.translate(m.x, m.y - lift); ctx.rotate(rot);
  const flip = key === d.side ? m.face : (m.face < 0 ? -1 : 1);
  ctx.scale(sx * flip, sy);
  if (im.complete) ctx.drawImage(im, -S.w / 2, -S.h, S.w, S.h);
  ctx.restore();
  // 체력 막대
  if (m.hp < d.hp || d.boss){
    const w = d.boss ? 86 : 36, y = m.y - S.h - lift - (d.boss ? 18 : 8);
    ctx.fillStyle = 'rgba(30,24,18,.7)'; ctx.fillRect(m.x - w / 2 - 1, y - 1, w + 2, 7);
    ctx.fillStyle = d.boss ? '#ffb340' : '#ff6b7a'; ctx.fillRect(m.x - w / 2, y, w * Math.max(0, m.hp) / d.hp, 5);
    if (d.boss){
      ctx.font = '13px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = '#fff6e4';
      ctx.strokeStyle = 'rgba(30,24,18,.8)'; ctx.lineWidth = 3;
      ctx.strokeText(d.name, m.x, y - 5); ctx.fillText(d.name, m.x, y - 5);
    }
  }
}
function drawSlash(){
  if (P.atkT < 0 || P.atkT > 0.2) return;
  const [vx, vy] = dirVec();
  const base = Math.atan2(vy, vx), p = Math.min(1, P.atkT / 0.13);
  const cx = P.x + vx * 6, cy = P.y - TS * 0.45 + vy * 6, r = TS * 0.95;
  const a0 = base - 1.2, a1 = a0 + 2.4 * p;
  ctx.save(); ctx.lineCap = 'round';
  ctx.globalAlpha = 1 - Math.max(0, (P.atkT - 0.12) / 0.08);
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,120,.8)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, a0 + 0.2, a1); ctx.stroke();
  ctx.restore();
}
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font-ui') || 'sans-serif';

function draw(t){
  const z = Math.max(0.9, Math.min(1.7, Math.min(vw, vh) / (8.5 * TS))) * ZOOMS[zi][1];
  ctx.setTransform(dpr * z, 0, 0, dpr * z, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  const sw = vw / z, sh = vh / z;
  let cx = P.x - sw / 2, cy = P.y - TS * 0.8 - sh / 2;
  cx = Math.max(0, Math.min(MW * TS - sw, cx)); cy = Math.max(0, Math.min(MH * TS - sh, cy));
  if (sw > MW * TS) cx = (MW * TS - sw) / 2; if (sh > MH * TS) cy = (MH * TS - sh) / 2;
  if (shake > 0){ cx += (Math.random() - 0.5) * 10 * shake / 0.25; cy += (Math.random() - 0.5) * 10 * shake / 0.25; }
  ctx.fillStyle = '#4f8f36'; ctx.fillRect(0, 0, sw, sh);
  ctx.translate(-Math.round(cx * z) / z, -Math.round(cy * z) / z);

  const x0 = Math.max(0, Math.floor(cx / TS)), x1 = Math.min(MW - 1, Math.floor((cx + sw) / TS));
  const y0 = Math.max(0, Math.floor(cy / TS)), y1 = Math.min(MH - 1, Math.floor((cy + sh) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    const im = tileImg[map[y][x]]; if (im.complete) ctx.drawImage(im, x * TS, y * TS, TS + 0.6, TS + 0.6);
  }

  const list = [];
  const inView = (x, y, w, h) => !(x + w < cx || x - w > cx + sw || y - h > cy + sh || y > cy + sh + h);
  for (const ob of objects){
    if (!inView(ob.x, ob.y, ob.o.w, ob.o.h)) continue;
    if (ob.o.flat){ const im = objImg[ob.name]; if (im.complete) ctx.drawImage(im, ob.x - ob.o.w / 2, ob.y - ob.o.h * 0.75, ob.o.w, ob.o.h); continue; }
    list.push({ y: ob.y, ob });
  }
  for (const m of mons) if (!m.dead && inView(m.x, m.y, 60, 120)) list.push({ y: m.y, m });
  list.push({ y: P.y, p: true });
  list.sort((a, b) => a.y - b.y);

  const frameNo = P.moving && P.dashT < 0 ? 1 + (Math.floor(P.anim) % 4) : (P.dashT >= 0 ? 2 : 0);
  const bob = P.moving ? 0 : Math.sin(t * 2.2) * 1.2;
  const C = ELF;
  const pBox = { l: P.x - C.w / 2, r: P.x + C.w / 2, t: P.y - C.h, b: P.y };

  for (const it of list){
    if (it.p){
      if (P.dead > 0){
        drawElf(P.x, P.y, 'front', 1, 0, 0, Math.max(0, (P.dead - 1.2)));
        continue;
      }
      ctx.fillStyle = 'rgba(30,40,20,.28)';
      ctx.beginPath(); ctx.ellipse(P.x, P.y, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
      P.trail.forEach((g, i) => drawElf(g.x, g.y, g.dir, g.face, 2, 0, 0.12 + i * 0.04));
      let ox = 0, oy = 0;
      if (P.atkT >= 0){ const [vx, vy] = dirVec(); const k = Math.sin(Math.min(1, P.atkT / 0.14) * Math.PI) * 7; ox = vx * k; oy = vy * k; }
      const blink = P.inv > 0 && Math.floor(P.inv * 16) % 2 ? 0.35 : 1;
      drawElf(P.x + ox, P.y + oy - bob, P.dir, P.face, frameNo, 0, blink);
      drawSlash();
    } else if (it.m){
      drawMon(it.m, t);
    } else {
      const ob = it.ob, o = ob.o, im = objImg[ob.name];
      let a = 1;
      if (ob.y > P.y && o.h > TS * 1.2){
        const l = ob.x - o.w / 2, r = ob.x + o.w / 2, tp = ob.y - o.h;
        if (pBox.r > l + 6 && pBox.l < r - 6 && pBox.t < ob.y - TS * 0.4 && pBox.b > tp) a = 0.5;
      }
      ctx.globalAlpha = a;
      if (im.complete) ctx.drawImage(im, ob.x - o.w / 2, ob.y - o.h + 4, o.w, o.h);
      ctx.globalAlpha = 1;
    }
  }
  // 파티클
  for (const f of fx){
    ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 숫자
  ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,24,18,.85)';
  for (const tx of texts){
    ctx.globalAlpha = Math.min(1, tx.life / 0.4);
    ctx.font = (tx.big ? '20px ' : '16px ') + FONT;
    ctx.strokeText(tx.txt, tx.x, tx.y); ctx.fillStyle = tx.col; ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
const hpFill = document.getElementById('hpFill'), infoEl = document.getElementById('info'), msgEl = document.getElementById('msg');
let lastHp = -1, lastKills = -1, lastDead = null;
function hud(){
  if (P.hp !== lastHp){ hpFill.style.width = (P.hp / P.maxHp * 100) + '%'; lastHp = P.hp; }
  if (kills !== lastKills){ infoEl.textContent = '체력 ' + P.hp + '/' + P.maxHp + ' · 처치 ' + kills; lastKills = kills; }
  else if (P.hp !== +infoEl.dataset.hp){ infoEl.textContent = '체력 ' + P.hp + '/' + P.maxHp + ' · 처치 ' + kills; }
  infoEl.dataset.hp = P.hp;
  const dead = P.dead > 0; if (dead !== lastDead){ msgEl.hidden = !dead; lastDead = dead; }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(now / 1000); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

</script>
