  };
})();
// 진동 (안드로이드 크롬)
const HAP = (p) => { if (!AUDIO_SETTINGS.get().vibration) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
// ---- 기존 동작에 소리·진동 붙이기 (원래 함수는 그대로 두고 감싼다) ----
(() => {
  const wrap = (name, before, after) => {
    let f; try { f = eval(name); } catch (e) { return; } if (typeof f !== 'function') return;
    const g = function(...a){ if (before) before(...a); const r = f.apply(this, a); if (after) after(r, ...a); return r; };
    eval(name + ' = g');
  };
  const originalAttack=attack;
  attack=function(...args){const previous=P.atk,r=originalAttack.apply(this,args);if(P.atk&&P.atk!==previous){const w=P.atk.wt;SFX.play(w==='bow'?'bow':w==='staff'?'staff':w==='spear'?'thrust':w==='gauntlet'?'punch':'swing');}return r;};
  wrap('hitTarget', null, () => { const p = pops[pops.length - 1]; SFX.play(p && p.crit ? 'crit' : 'hit'); HAP(p && p.crit ? 28 : 12); });   // 허수아비·몬스터 공통 타격
  if (typeof killMonster === 'function') wrap('killMonster', null, () => { SFX.play('kill'); HAP(18); });
  if (typeof hurtPlayer === 'function') wrap('hurtPlayer', (v) => { if (playerInv <= 0 && !traveling){ SFX.play('hurt'); HAP(45); } });
  wrap('cast',null,(ok,id)=>{if(!ok)return;SFX.play({fire1:'fire',fire2:'fire',fire3:'fire_big',ice1:'ice',ice2:'ice',ice3:'ice_big',bolt1:'lightning',bolt2:'lightning',bolt3:'lightning',dark1:'dark',dark2:'dark',dark3:'dark_big',holy1_heal:'heal',holy2_shield:'heal',holy3_revive:'heal',sword1:'slash',sword2:'spin',sword3:'slash',spear1:'thrust',spear2:'thrust',spear3:'explosion',bow1:'bow',bow2:'bow',bow3:'bow',fist1:'punch',fist2:'punch',fist3:'explosion'}[id]||'staff');HAP(id==='sword2'||id==='fire3'||id==='dark3'||id==='spear3'||id==='fist3'?[18,20,28]:id==='fire1'||id==='fire2'?[12,22,34]:id==='sword1'||id==='sword3'?28:18);});
  wrap('drink', null, (ok) => { if (ok){ SFX.play('potion'); HAP([10, 40, 10]); } });
  wrap('travel', () => { if (!traveling) SFX.play('travel'); });
  // 생활스킬 타운 포탈/귀환 포탈은 실제 텔레포트 파일 효과음
  if (window.GAME && GAME.useTownPortal){ const f=GAME.useTownPortal; GAME.useTownPortal=function(...a){ const r=f.apply(this,a); if(r) SFX.play('teleport'); return r; }; }
  if (window.GAME && GAME.returnTownPortal){ const f=GAME.returnTownPortal; GAME.returnTownPortal=function(...a){ const r=f.apply(this,a); if(r) SFX.play('teleport'); return r; }; }
  if (typeof openDungeonChest === 'function') wrap('openDungeonChest', (spot) => { const m = spot && spot.data && spot.data.mimic; SFX.play(m ? 'mimic' : 'chest'); HAP(m ? [60, 30, 60] : [15, 40, 15]); });
  if (typeof nextDungeonFloor === 'function') wrap('nextDungeonFloor', () => SFX.play('stairs'));
  if (typeof previousDungeonFloor === 'function') wrap('previousDungeonFloor', () => SFX.play('stairs'));
  let lastGold = P.gold;
  wrap('setGold', (v) => { if (v > lastGold) SFX.play('coin'); else if (v < lastGold) SFX.play('buy'); lastGold = v; });
  // 가방에 물건이 들어오면 (ui.js가 나중에 로드되므로 잠시 뒤 연결)
  setTimeout(() => { if (window.UI && UI.add){ const a = UI.add; UI.add = function(it){ const r = a.call(this, it); if (r) SFX.play('item'); return r; }; } }, 0);
  const refresh=()=>{
    const v=AUDIO_SETTINGS.get();
    for(const key of ['sfx','bgm']){const value=Math.round(v[key]*100);$('volume_'+key).value=value;$('value_'+key).textContent=value+'%';}
    $('vibration').checked=v.vibration;
  };
  $('settingsBtn').addEventListener('click',()=>{show('settings');P.hold=false;refresh();});
  for(const key of ['sfx','bgm'])$('volume_'+key).addEventListener('input',e=>{AUDIO_SETTINGS.set(key,Number(e.target.value)/100);refresh();});
  $('vibration').addEventListener('change',e=>AUDIO_SETTINGS.set('vibration',e.target.checked));
  $('escapeStuck').addEventListener('click',emergencyEscape);

// 첫 입력 후 음악을 재생하고 장소·전투·이벤트가 바뀌면 교차한다.
const BGM = (() => {
  const tracks=A.bgm||{},level={town:.25,field:.24,dungeon:.19,boss:.28,event:.22},fadeMs=1400;
  let unlocked=false,current=null,activeBoss=null,eventOverride=false;
  const fading=new Set(),ramps=new WeakMap();
  function target(){
    if(eventOverride||(window.QUEST&&QUEST.isDialog()))return 'event';
    if(MAP!=='dungeon'&&MAP!=='field'){activeBoss=null;return MAP==='town'||MAP==='sand'||MAP==='inn'?'town':'field';}
    if(activeBoss&&(!monsters.includes(activeBoss)||activeBoss.dead))activeBoss=null;
    if(!activeBoss)activeBoss=monsters.find(m=>m.boss&&!m.dead&&(m.state==='chase'||Math.hypot(m.x-P.x,m.y-P.y)<360))||null;
    return activeBoss?'boss':MAP;
  }
  function ramp(a,goal,done){
    const token={};ramps.set(a,token);const start=performance.now(),from=a.volume;
    function tick(now){
      if(ramps.get(a)!==token)return;
      const p=Math.min(1,(now-start)/fadeMs);a.volume=Math.max(0,Math.min(1,from+(goal-from)*p));
      if(p<1)requestAnimationFrame(tick);else if(done)done();
    }requestAnimationFrame(tick);
  }
  function play(a){a.play().catch(()=>{});}
  function sync(){
    if(!unlocked)return;
    const volume=AUDIO_SETTINGS.get().bgm;
    if(!volume||document.hidden){
      if(current){ramps.delete(current.audio);current.audio.pause();current.audio.volume=0;current.goal=null;}
      for(const a of fading){ramps.delete(a);a.pause();}fading.clear();return;
    }
    const name=target();if(!tracks[name])return;
    const goal=level[name]*volume;
    if(current&&current.name===name){
      if(current.audio.paused)play(current.audio);
      if(current.goal!==goal){current.goal=goal;ramp(current.audio,goal);}return;
    }
    if(current){const old=current.audio;fading.add(old);ramp(old,0,()=>{old.pause();old.currentTime=0;fading.delete(old);});}
    const audio=new Audio(tracks[name]);audio.loop=true;audio.preload='none';audio.volume=0;
    current={name,audio,goal};play(audio);ramp(audio,goal);
  }
  const unlock=()=>{unlocked=true;sync();};
  addEventListener('pointerdown',unlock,{capture:true});addEventListener('keydown',unlock,{capture:true});
  document.addEventListener('visibilitychange',sync);setInterval(sync,300);
  return {sync,setEvent:on=>{eventOverride=!!on;sync();},get track(){return current&&current.name;},state:()=>({track:current?.name,volume:current?.audio.volume,paused:current?.audio.paused})};
})();
window.AUDIO={settings:AUDIO_SETTINGS,sfx:SFX,bgm:BGM,haptic:HAP};

// 문플로의 문서 선택/연결 방식. 백업은 sandrock_* 문자열 값의 묶음이며 저장 스키마는 유지한다.
(() => {
  const bridge=window.ArpgBridge, el=id=>document.getElementById(id);
  if(!bridge||typeof bridge.pickBackup!=='function'||typeof bridge.backupStatus!=='function'||typeof bridge.restoreBackup!=='function')return;
  el('driveBackup').hidden=false;
  let busy=false;
  const automatic=typeof bridge.syncBackup==='function';
  if(automatic)el('restoreBackup').textContent='지금 동기화';
  const cover=document.createElement('div');
  cover.textContent='최신 저장 확인 중…';
  cover.style.cssText='position:fixed;inset:0;z-index:1000;background:#17120de6;color:#fff;display:none;align-items:center;justify-content:center;font:700 18px sans-serif';
  document.body.append(cover);
  let syncTimer;
  window.onArpgSyncDone=()=>{clearTimeout(syncTimer);window.ARPG_SYNC_CHECKING=false;cover.style.display='none';busy=false;refresh();};
  window.onArpgSyncStart=()=>{
    clearTimeout(syncTimer);busy=true;window.ARPG_SYNC_CHECKING=true;cover.style.display='flex';
    syncTimer=setTimeout(window.onArpgSyncDone,8000);refresh();
  };
  function refresh(){
    let s={};try{s=JSON.parse(bridge.backupStatus()||'{}');}catch(e){}
    el('backupStatus').textContent='백업 파일: '+(s.linked?'연결됨':'안 됨')+' · 마지막 백업: '+(s.at?new Date(s.at).toLocaleString('ko-KR'):'없음')+
      (automatic?(s.online===false?' · 오프라인 · 기기 저장으로 진행':s.syncing?' · 동기화 중':s.error?' · 동기화 대기':' · 자동 동기화'):(s.held?' · 불러오기 대기':s.error?' · 백업 실패':''));
    el('restoreBackup').disabled=!s.linked||busy;el('pickBackup').disabled=busy;
  }
  const message=text=>{el('backupMessage').textContent=text||'';refresh();};
  window.onArpgBackup=message;
  window.onArpgBackupFail=text=>{try{bridge.cancelRestore();}catch(e){}window.onArpgSyncDone();window.ARPG_BACKUP_RESTORING=false;message(text);};
  function valid(text){
    if(window.ARPG_SAVE_SYNC)return ARPG_SAVE_SYNC.valid(text);
    const all=JSON.parse(text);
    if(!all||Array.isArray(all)||typeof all!=='object'||Object.keys(all).some(k=>!k.startsWith('sandrock_')||typeof all[k]!=='string'))throw Error();
    const s=JSON.parse(all.sandrock_save_v3),obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
    if(s.v!==3||!Number.isInteger(s.lv)||s.lv<1||s.lv>70||!['gold','hp','mp'].every(k=>Number.isFinite(s[k]))||!obj(s.stats)||!Array.isArray(s.bag)||!obj(s.eq))throw Error();
    return all;
  }
  window.onArpgRestore=text=>{
    let all;try{all=valid(text);}catch(e){window.onArpgBackupFail('불러올 수 없는 파일입니다. 기존 저장은 유지됩니다.');return;}
    try{bridge.applyBackup();}catch(e){window.onArpgBackupFail('기기 저장을 갱신하지 못했습니다.');}
  };
  window.onArpgBackupApplied=text=>{
    let all;try{all=valid(text);}catch(e){window.onArpgBackupFail('불러올 수 없는 파일입니다.');return;}
    // pagehide/4초 자동 저장이 예전 플레이 상태를 덮어쓰지 않도록 불러오기 동안 저장을 막는다.
    window.ARPG_BACKUP_RESTORING=true;
    try{
      if(window.ARPG_SAVE_SYNC)ARPG_SAVE_SYNC.apply(all);
      else for(const k of Object.keys(localStorage))if(k.startsWith('sandrock_'))localStorage.removeItem(k);
      for(const [k,v] of Object.entries(all)){
        if(!window.ARPG_SAVE_SYNC)localStorage.setItem(k,v);
        // 앱 브리지 쪽 저장도 즉시 같은 값으로 맞춘다. 브라우저 저장만 바뀐 뒤 reload 되며
        // 앱의 더 최신 기본 저장이 다시 덮어쓰는 복원 회귀를 막는다.
        try{bridge.put(k,String(v));}catch(e){}
      }
      location.reload();
    }catch(e){message('기기 저장을 갱신하지 못했습니다. 앱을 완전히 껐다 켜 주세요.');}
  };
  el('settingsBtn').addEventListener('click',refresh);
  el('pickBackup').addEventListener('click',()=>{try{if(window.UI)UI.save();bridge.pickBackup();}catch(e){message('파일 선택 화면을 열지 못했습니다.');}});
  el('restoreBackup').addEventListener('click',()=>{
    if(automatic){if(!busy){window.onArpgSyncStart();try{bridge.syncBackup();}catch(e){window.onArpgSyncDone();}}return;}
    if(busy||!confirm('현재 진행을 백업 파일 내용으로 바꿉니다. 불러오시겠습니까?'))return;
    busy=true;window.ARPG_BACKUP_RESTORING=true;message('백업 파일을 읽는 중입니다.');
    try{bridge.restoreBackup();}catch(e){window.onArpgBackupFail('백업 파일을 읽지 못했습니다.');}
  });
  if(automatic){
    addEventListener('online',()=>bridge.syncBackup());
    if(window.ARPG_SYNC_CHECKING)window.onArpgSyncStart();
    try{bridge.webReady();}catch(e){window.onArpgSyncDone();}
  }
  refresh();
})();

function tradeRegionDef(k){ return TRADE_REGIONS[k] || TRADE_REGIONS.town; }
function tradeMod(region,id){ return tradeRegionDef(region).m[id] || 1; }
function tradePressure(region,id){

let guildNowOverride=null;
let guildExamPanelOpen=false;
let guildAbandonArmed=0;
let guildState={seq:1,board:[],active:[],completed:0,rank:0,rankDone:0,dayKey:'',todayAccepted:0,bribeCount:0,exam:null};

function guildNow(){return guildNowOverride==null?Date.now():guildNowOverride;}
function guildDayKey(ms=guildNow()){
  const d=new Date(ms-4*60*60*1000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function guildRank(){return Math.max(0,Math.min(6,guildState.rank|0));}
function guildRankTier(){return guildRank()+1;}
function guildQuestTier(){return Math.min(window.GAME&&GAME.levelTier?GAME.levelTier(P.lv):1,guildRankTier());}
function guildRankName(r=guildRank()){return GUILD_RANKS[Math.max(0,Math.min(6,r))]+'급';}
function guildRankMul(r=guildRank()){return GUILD_RANK_REWARD[Math.max(0,Math.min(6,r))]||1;}
function guildDailyCap(){return GUILD_DAILY_BASE+Math.min(3,guildState.bribeCount|0)*GUILD_EXTRA_BATCH;}
function guildRound10(v){return Math.max(10,Math.round(v/10)*10);}
function guildBaseGold(tier,lv=P.lv){return Math.round(35+Math.max(1,lv)*8+tier*22);}
function guildReward(tier){
  const mul=guildRankMul(),exp0=window.GAME&&GAME.questExp?GAME.questExp('guild',P.lv):10;
  return {exp:Math.max(1,Math.round(exp0*mul)),gold:Math.max(1,Math.round(guildBaseGold(tier)*mul)),gear:Math.random()<.28};
}
function guildExamFee(rank=guildRank()){
  const tier=rank+1,lv=window.GAME&&GAME.tierMaxLevel?GAME.tierMaxLevel(tier):tier*10;
  return guildRound10(guildBaseGold(tier,lv)*guildRankMul(rank)*GUILD_DAILY_BASE*GUILD_EXAM_DAYS);
}
function guildBribeFee(){
  const tier=guildQuestTier(),rate=GUILD_BRIBE_RATES[Math.min(2,guildState.bribeCount|0)]||0;
  return guildRound10(guildBaseGold(tier,P.lv)*guildRankMul()*GUILD_EXTRA_BATCH*rate);
}
function guildSyncDay(save=true){
  const k=guildDayKey();
  if(guildState.dayKey===k)return false;
  guildState.dayKey=k;guildState.todayAccepted=0;guildState.bribeCount=0;guildState.board=[];
  guildGenerate();
  if(save&&window.UI&&UI.save)UI.save();
  return true;
}
function guildMake(type,idx){
  const tier=guildQuestTier(),rew=guildReward(tier),q={id:guildState.seq++,type,tier,prog:0,accepted:false,rank:guildRank(),...rew};
  if(type==='kill_any'){
    q.need=8+tier*2+(idx%3);q.title='주변 정리';q.desc='T'+tier+' 전투 지역의 몬스터 '+q.need+'마리 처치';
  }else if(type==='kill_type'){
    const pool=THEME_MOBS[GUILD_TIER_THEME[tier]]||THEME_MOBS.spring,target=pool[(idx+tier)%pool.length];
    q.target=target;q.need=4+tier;q.title=GUILD_MOB_NAME[target]+' 소탕';q.desc=GUILD_MOB_NAME[target]+' '+q.need+'마리 처치';
  }else if(type==='floor'){
    q.need=Math.max(2,tier*3);q.title='던전 정찰';q.desc='던전 지하 '+q.need+'층에 도달';
  }else{
    const goods=TRADE.goods,g=goods[(tier*3+idx*5)%goods.length];
    q.goodId=g.id;q.goodName=g.name;q.need=4+tier*2;q.title='긴급 납품';q.desc=g.name+' '+q.need+'개 납품';
  }
  return q;
}
function guildGenerate(){
  const types=['kill_any','kill_any','kill_type','kill_type','floor','delivery'];
  while(guildState.board.length<6){
    const idx=guildState.seq,type=types[(guildState.seq-1)%types.length];
    guildState.board.push(guildMake(type,idx));
  }
}
function guildDone(q){
  if(q.type==='delivery'){const c=TRADE.cargo()[q.goodId];return !!c&&c.qty>=q.need;}
  return (q.prog||0)>=q.need;
}
function guildProgressText(q){
  if(q.type==='delivery'){const c=TRADE.cargo()[q.goodId];return (c?c.qty:0)+' / '+q.need;}
  return Math.min(q.need,q.prog||0)+' / '+q.need;
}
function guildTrack(){
  const host=$('questTrack');if(!host)return;
  host.onclick=()=>guildOpen();host.title='의뢰창 열기';host.innerHTML='';
  if(!guildState.active.length){host.classList.remove('on');return;}
  host.classList.add('on');
  for(const q of guildState.active.slice(0,5)){
    const done=guildDone(q),row=document.createElement('div');row.className='qtrack'+(done?' done':'');
    row.innerHTML='<span class="qcheck"></span><span class="qtitle">'+q.title+'</span><span class="qprog">'+guildProgressText(q)+'</span>';
    host.append(row);
  }
}
function guildAccept(id){
  guildSyncDay();
  if(guildState.active.length>=5){say('진행 중 의뢰는 최대 5개입니다.');return false;}
  if(guildState.todayAccepted>=guildDailyCap()){
    guildExamPanelOpen=false;guildRender();say(guildState.bribeCount>=3?'오늘은 더 받을 수 없습니다.':'접수원이 장부를 덮었다가 다시 열었습니다. 뭔가 할 말이 있는 눈치입니다.');return false;
  }
  const i=guildState.board.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.board.splice(i,1)[0];q.accepted=true;guildState.active.push(q);guildState.todayAccepted++;
  guildGenerate();guildRender();guildTrack();if(window.UI&&UI.save)UI.save();return true;
}
function guildRandomGear(tier){
  const r=Math.random();
  if(r<.58){const wt=['sword','spear','gauntlet','bow','staff'][Math.floor(Math.random()*5)];return UI.make({kind:'weapon',wt,tier,roll:true});}
  if(r<.9){const kinds=['head','body','hands','feet'];return UI.make({kind:kinds[Math.floor(Math.random()*kinds.length)],tier,roll:true});}
  return UI.make({kind:Math.random()<.5?'ring':'neck',tier,roll:true});
}
function guildClaim(id){
  guildSyncDay();
  const i=guildState.active.findIndex(q=>q.id===id);if(i<0)return false;
  const q=guildState.active[i];if(!guildDone(q)){say('아직 의뢰 조건을 채우지 못했습니다.');return false;}
  if(q.type==='delivery'&&!TRADE.consume(q.goodId,q.need)){say('납품 물품이 부족합니다.');return false;}
  GAME.gainExp(q.exp);GAME.setGold(P.gold+q.gold);let extra='';
  if(q.gear&&window.UI){
    const it=guildRandomGear(Math.max(1,Math.min(7,q.tier)));
    if(UI.add(it))extra=' · '+it.name;
    else{const comp=50+q.tier*35;GAME.setGold(P.gold+comp);extra=' · 가방이 차서 '+comp+'G 추가';}
  }

function guildOnKill(m){

// 스토리 퀘스트 엔진. 제목·인물별 대사·진행 데이터는 봉인 JSON에만 둔다.
const MAIN_QUESTS=A.mainQuests.quests||[];
const SIDE_QUESTS=A.mainQuests.sideQuests||[];
const ALL_QUESTS=[...MAIN_QUESTS,...SIDE_QUESTS];
let mainQuestState={active:{},completed:[],items:{},visited:[],flags:{}};
let questDialog=null,questWorldKey='',questUiDirty=true;
const questDef=id=>ALL_QUESTS.find(q=>q.id===id);
const questKind=q=>(q&&q.kind)||((q&&String(q.id).startsWith('MAIN_'))?'main':'side');
const questStep=q=>q&&mainQuestState.active[q.id]?q.steps[mainQuestState.active[q.id].step]:null;
const questNpc=no=>npcs.find(n=>n.no===no||n.k==='npc_'+String(no).padStart(2,'0'));
function questSave(){questUiDirty=true;questRefreshWorld();questRender();if(window.UI&&UI.save)UI.save();}
function questAvailable(q){
  const s=q.start||{},main=questKind(q)==='main';
  return !mainQuestState.completed.includes(q.id)&&!mainQuestState.active[q.id]&&(main||P.lv>=(s.level||1))&&
    (!s.previous||mainQuestState.completed.includes(s.previous))&&(!s.visit||mainQuestState.visited.includes(s.visit));
}
function questMapMatches(s){
  if(!s)return true;
  if(s.map&&s.map!==MAP)return false;
  if(s.floor&&!(MAP==='dungeon'&&window.__DUN&&__DUN.state().floor===s.floor))return false;
  if(s.market){
    const m=CUR&&CUR.market?CUR.market:(MAP==='town'?'town':null);
    if(m!==s.market)return false;
  }
  if(s.leg&&!(MAP==='field'&&window.__FD&&__FD.state().leg===s.leg))return false;
  return true;
}
function questNpcAction(n){
  if(!n)return null;
  for(const q of ALL_QUESTS){
    const s=questStep(q);
    if(s&&['talk','deliver'].includes(s.type)&&n.no===s.npc&&questMapMatches(s))return {q,step:s,start:false};
  }
  for(const q of ALL_QUESTS)if(mainQuestState.active[q.id]&&q.start.npc===n.no)return {q,step:questStep(q),start:false,waiting:true};
  for(const q of ALL_QUESTS)if(questAvailable(q)&&q.start.npc===n.no&&(questMapMatches(q.start)||n.questStartAlias===q.start.map))return {q,start:true};
  return null;
}
function questMarker(n){const a=questNpcAction(n);return a?(a.start?'!':'?'):'';}
function questMiniTargets(){
  const out=[],seen=new Set();
  const add=(x,y,id,kind)=>{
    if(!Number.isFinite(x)||!Number.isFinite(y))return;
    const k=Math.round(x)+':'+Math.round(y);
    if(seen.has(k))return;seen.add(k);
    out.push({x,y,id,kind});
  };
  let activeMain=false;
  for(const q of ALL_QUESTS){
    if(!mainQuestState.active[q.id])continue;
    if(questKind(q)==='main')activeMain=true;
    const s=questStep(q);if(!s)continue;
    if(['talk','deliver'].includes(s.type)&&questMapMatches(s)){
      const n=questNpc(s.npc);if(n)add(n.x,n.y,q.id,'npc');
      continue;
    }
    if(s.point&&questMapMatches(s.point)){
      const p=questPoint(s);if(p)add(p.x,p.y,q.id,'point');
    }
  }
  if(!activeMain){
    const next=MAIN_QUESTS.find(q=>questAvailable(q));
    if(next){
      const n=questNpc(next.start.npc);
      if(n&&(questMapMatches(next.start)||n.questStartAlias===next.start.map))add(n.x,n.y,next.id,'start');
    }
  }
  return out;
}
function questAccept(id){
  const q=questDef(id),n=q&&questNpc(q.start.npc);
  if(!q||!questAvailable(q)||!n||!(questMapMatches(q.start)||n.questStartAlias===q.start.map)||Math.hypot(P.x-n.x,P.y-n.y)>90)return false;
  const reward=JSON.parse(JSON.stringify(q.reward||{}));
  reward.exp=Math.max(1,Math.round(expNeed(P.lv)*(reward.expRatio||(questKind(q)==='main'?.32:.18))));
  mainQuestState.active[id]={step:0,progress:0,reward};questSave();questCheckVisit();return true;
}
function questAdvance(q){
  const a=mainQuestState.active[q.id];if(!a)return false;
  const s=questStep(q);if(s&&s.give)for(const [id,n] of Object.entries(s.give))mainQuestState.items[id]=(mainQuestState.items[id]||0)+n;
  a.step++;a.progress=0;
  if(a.step>=q.steps.length)return questComplete(q);
  questSave();questCheckVisit();return true;
}
function questComplete(q){
  const a=mainQuestState.active[q.id];if(!a||a.step<q.steps.length||mainQuestState.completed.includes(q.id))return false;
  const r=a.reward;delete mainQuestState.active[q.id];mainQuestState.completed.push(q.id);
  if(q.effects&&q.effects.flags)for(const [k,v] of Object.entries(q.effects.flags))mainQuestState.flags[k]=v;
  setGold(P.gold+(r.gold||0));gainExp(r.exp||0);
  if(window.UI){
    for(const [k,n] of Object.entries(r.potions||{}))UI.addPotion(k,n);
    if(r.item&&!UI.add(UI.make(r.item))){setGold(P.gold+50);say('가방이 가득 차 장비 대신 50G를 받았습니다.');}
  }
  questSave();return true;
}
function questDecorateDialog(n){
  questDialog=null;
  const btn=$('dlgQuest'),a=questNpcAction(n);btn.hidden=!a;
  if(!a)return;
  const main=questKind(a.q)==='main';
  btn.textContent=a.start?(main?'★ 이야기 수락':'◇ 의뢰 수락'):(a.waiting?(main?'★ 진행 확인':'◇ 진행 확인'):(main?'★ 이야기 진행':'◇ 의뢰 진행'));

function questBeginDialog(n,a){
  if(Math.hypot(P.x-n.x,P.y-n.y)>90)return false;

  if ((s === 'w1' || s === 'w2') && !eq[cur]) cur = s;
  pickSel = { from: 'eq', slot: s }; tab = 'equip'; render(); showInfo(it, 'eq'); syncHud();saveGame();
}
function unequip(s){
  const i = bag.indexOf(null); if (i < 0){ G.say('가방이 가득 찼습니다'); return; }
  bag[i] = eq[s]; eq[s] = null;
  if (s === cur && !eq[cur]){ const o = s === 'w1' ? 'w2' : 'w1'; if (eq[o]) cur = o; }
  pickSel = { from: 'bag', i }; render(); showInfo(bag[i], 'bag'); syncHud();saveGame();
}

// 가방·상점·창고는 같은 Pointer Events 이동 규칙을 사용합니다.
let itemDrag=null,itemClickUntil=0;
const kindOrder=it=>{const list=it.kind==='weapon'?['sword','spear','gauntlet','bow','staff']:['head','body','hands','feet','ring','neck','material','potion','junk'],i=list.indexOf(it.kind==='weapon'?it.wt:it.kind);return i<0?99:(it.kind==='weapon'?i:5+i);};
function sortInventory(where,by){
  const a=where==='stash'?stash:bag,n=where==='stash'?a.length:bagLimit();
  const tier=(x,y)=>(y.tier||1)-(x.tier||1)||(y.rar||0)-(x.rar||0)||kindOrder(x)-kindOrder(y);
  const cmp=by==='price'?(x,y)=>__SHOP.baseValue(y)-__SHOP.baseValue(x):by==='kind'?(x,y)=>kindOrder(x)-kindOrder(y)||tier(x,y):tier;
  const filled=a.slice(0,n).filter(Boolean).map((it,i)=>({it,i})).sort((x,y)=>cmp(x.it,y.it)||x.i-y.i).map(x=>x.it);
  a.splice(0,n,...filled,...Array(n-filled.length).fill(null));pickSel=null;$('iinfo').classList.remove('on');if(tab==='shop')__SHOP.clearSelection();render();saveGame();
}
function sortButtons(where){
  const bar=el('div','inventorySort');for(const [key,label] of [['tier','티어'],['price','가격'],['kind','종류']]){const b=el('button','btn',label);b.type='button';b.dataset.sort=key;b.onclick=()=>sortInventory(where,key);bar.append(b);}return bar;
}
function bagPageDots(){const bar=el('div','bagPages');for(let i=0;i<bagPages;i++){const b=el('button','bagDot');b.type='button';b.classList.toggle('on',i===bagPage);b.setAttribute('aria-label','가방 '+(i+1)+'페이지');b.onclick=()=>{bagPage=i;pickSel=null;$('iinfo').classList.remove('on');render();};bar.append(b);}return bar;}
let bagSwipe=null;const bagPaneEl=$('bagPane');
bagPaneEl.addEventListener('pointerdown',e=>{if(!$('char').classList.contains('on')||bagPages<2)return;bagSwipe={x:e.clientX,y:e.clientY};});
bagPaneEl.addEventListener('pointerup',e=>{if(!bagSwipe)return;const dx=e.clientX-bagSwipe.x,dy=e.clientY-bagSwipe.y;bagSwipe=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){cancelItemDrag();itemClickUntil=performance.now()+450;bagPage=Math.max(0,Math.min(bagPages-1,bagPage+(dx<0?1:-1)));pickSel=null;$('iinfo').classList.remove('on');render();e.preventDefault();}});

function inventoryItem(ref){return ref.from==='eq'?eq[ref.slot]:ref.from==='goods'?ref.it:(ref.from==='stash'?stash:bag)[ref.i];}
function inventoryDrop(source,target){
  if(!source||!target)return false;const it=inventoryItem(source);if(!it)return false;
  if(source.from==='goods')return target.from==='bag'&&__SHOP.buyAt(source.it,target.i);
  if(target.from==='merchant'||target.from==='goods'){if(source.from==='bag'&&it.locked){G.say('잠긴 아이템입니다.');return false;}return source.from==='bag'&&__SHOP.sellAt(source.i);}
  if(source.from==='eq'){
    if(target.from!=='bag'||!eq[source.slot])return false;
    const other=bag[target.i];if(other&&(!slotOk(other,source.slot)||!canEquip(other)))return false;
    bag[target.i]=it;eq[source.slot]=other;
  }else if(target.from==='eq'){
    if(source.from!=='bag'||!slotOk(it,target.slot)||!canEquip(it)){G.say('이 칸에 착용할 수 없거나 착용 레벨이 부족합니다.');return false;}
    bag[source.i]=eq[target.slot];eq[target.slot]=it;
  }else{
    if(!['bag','stash'].includes(source.from)||!['bag','stash'].includes(target.from))return false;
    if((source.from==='stash'||target.from==='stash')&&tab!=='stash')return false;
    const a=source.from==='stash'?stash:bag,b=target.from==='stash'?stash:bag;
    if(target.i<0||target.i>=b.length)return false;
    [a[source.i],b[target.i]]=[b[target.i],a[source.i]];
  }
  if(!eq[cur])cur=eq.w1?'w1':eq.w2?'w2':'w1';pickSel=null;$('iinfo').classList.remove('on');render();syncHud();saveGame();return true;
}
function cancelItemDrag(){if(!itemDrag)return;if(itemDrag.holdTimer)clearTimeout(itemDrag.holdTimer);itemDrag.node.classList.remove('dragging');if(itemDrag.ghost)itemDrag.ghost.remove();itemDrag=null;}
function bindItemSlot(node,ref){
  node.dataset.inventory=ref.from;if(ref.i!=null)node.dataset.index=ref.i;if(ref.slot)node.dataset.eq=ref.slot;node._inventoryRef=ref;
  node.addEventListener('click',e=>{if(performance.now()<itemClickUntil){e.stopImmediatePropagation();e.preventDefault();}},true);
  node.addEventListener('pointerdown',e=>{
    if(e.button!==0||!inventoryItem(ref))return;cancelItemDrag();itemDrag={ref,node,pid:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:false,long:false};node.setPointerCapture(e.pointerId);
    if(ref.from==='bag')itemDrag.holdTimer=setTimeout(()=>{const d=itemDrag,it=d&&inventoryItem(d.ref);if(!d||d.ref!==ref||d.moved||!it)return;it.locked=!it.locked;d.long=true;itemClickUntil=performance.now()+550;G.say(it.locked?'아이템을 잠갔습니다.':'아이템 잠금을 풀었습니다.');saveGame();},550);
  });
}
addEventListener('pointermove',e=>{
  const d=itemDrag;if(!d||e.pointerId!==d.pid)return;const dist=Math.hypot(e.clientX-d.x,e.clientY-d.y);
  if(!d.moved&&(dist>=8||(performance.now()-d.t>=200&&dist>=2))){d.moved=true;if(d.holdTimer){clearTimeout(d.holdTimer);d.holdTimer=0;}d.node.classList.add('dragging');const im=el('img','itemGhost');const it=inventoryItem(d.ref);im.src=A.icons[it.icon||it.ic];d.ghost=im;document.body.append(im);$('iinfo').classList.remove('on');}
  if(d.moved){e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';}
},{passive:false});
addEventListener('pointerup',e=>{
  const d=itemDrag;if(!d||e.pointerId!==d.pid)return;
  if(d.long){cancelItemDrag();render();return;}
  if(d.moved){const at=document.elementFromPoint(e.clientX,e.clientY),cell=at&&at.closest('[data-inventory]');const target=cell?cell._inventoryRef:at&&at.closest('#shop')?{from:'merchant'}:null;itemClickUntil=performance.now()+500;cancelItemDrag();inventoryDrop(d.ref,target);}else{const ref=d.ref;cancelItemDrag();dblTap(ref);}
});
// 더블클릭(모바일은 두 번 탭): 상점에선 사기·팔기, 창고에선 넣기·빼기, 평소엔 장비 착용·해제
let lastTap=null;
function dblTap(ref){
  const now=performance.now(),cur0=inventoryItem(ref),key=ref.from+':'+(ref.i!=null?ref.i:ref.slot||'')+':'+(cur0?cur0.id:'');
  if(lastTap&&lastTap.key===key&&now-lastTap.t<380){lastTap=null;quickMove(ref);return;}
  lastTap={key,t:now};
}
function quickMove(ref){
  const it=inventoryItem(ref);if(!it)return;
  const toBag=()=>{const i=bagFreeIndex();if(i<0){G.say('가방이 가득 찼습니다.');return;}inventoryDrop(ref,{from:'bag',i});};
  if(ref.from==='goods'||ref.from==='stash'||ref.from==='eq'){toBag();return;}
  if(ref.from!=='bag')return;
  if(tab==='shop'){inventoryDrop(ref,{from:'merchant'});return;}
  if(tab==='stash'){const i=stash.indexOf(null);if(i<0){G.say('창고가 가득 찼습니다.');return;}inventoryDrop(ref,{from:'stash',i});return;}
  const slots=(it.kind==='weapon'?['w1','w2']:it.kind==='ring'?['ring1','ring2']:[it.kind]).filter(s=>s in eq);
  if(!slots.length)return;
  inventoryDrop(ref,{from:'eq',slot:slots.find(s=>!eq[s])||(slots.includes(cur)?cur:slots[0])});
}
addEventListener('pointercancel',cancelItemDrag);addEventListener('blur',cancelItemDrag);
function openStash(){
  const loc=G.locationState();if(!loc||!['town','village'].includes(loc.map)){G.say('창고는 마을에서만 이용할 수 있습니다.');return false;}openChar('stash');return true;
}
function renderStash(L){
  const frame=el('div','stashFrame');frame.append(el('h2','','개인 창고'),el('small','',`${stash.filter(Boolean).length} / ${STASH} · 이용료 없음`));
  const grid=el('div','stashGrid');stash.forEach((it,i)=>{const b=slotEl(it,0,0,46,46,()=>stashInfo('stash',i),false);b.style.cssText='position:relative;width:100%;height:100%';bindItemSlot(b,{from:'stash',i});grid.append(b);});frame.append(grid,sortButtons('stash'));L.append(frame);
}
function stashInfo(from,i){
  const a=from==='stash'?stash:bag,it=a[i];if(!it)return;pickSel={from,i};const I=$('iinfo');I.innerHTML='';I.append(el('div','iname',it.name),el('div','isub',`T${it.tier||1} · ${RARN[it.rar||0]}`));const b=el('button','btn',from==='bag'?'창고에 넣기':'가방으로 꺼내기');b.type='button';b.onclick=()=>{const to=from==='bag'?'stash':'bag',idx=to==='stash'?stash.indexOf(null):bagFreeIndex();if(idx<0){G.say(to==='stash'?'창고가 가득 찼습니다.':'가방이 가득 찼습니다.');return;}inventoryDrop({from,i},{from:to,i:idx});};I.append(b);I.classList.add('on');
}

window.UI = {
  addPotion(k,n){POT[k]+=n;syncPot();},potions:()=>({hp:POT.hp,mp:POT.mp}),
  addScroll(k,n){const had=SCR[k]|0;SCR[k]=Math.min(SCR_MAX,had+n);syncMmBtn();if($('char').classList.contains('on'))render();return SCR[k]-had;},
  scrolls:()=>({portal:SCR.portal,ident:SCR.ident}),scrollMax:SCR_MAX,
  useScroll(k){if(!(SCR[k]>0))return false;SCR[k]--;syncMmBtn();if($('char').classList.contains('on'))render();saveGame();return true;},
  make,canEquip,equip,itemStats,identify:identifyItem,identifyCost,openIdentifyVendor,identifyVendorOpen:()=>identifyVendor,UNID_MIN_AFFIXES,inventoryDrop,sortInventory,openStash,stashOpen:()=>tab==='stash'&&$('char').classList.contains('on'),stashItems:()=>stash.map((it,i)=>it?{i,it}:null).filter(Boolean),
  merchant(){openChar('shop');},bindItemSlot,addAt(it,i){if(i<0||i>=bagLimit()||bag[i])return false;bag[i]=it;return true;},add(it){const i=bagFreeIndex();if(i<0)return false;bag[i]=it;return true;},
  bagPages:()=>bagPages,bagPage:()=>bagPage,bagUpgradePrice:()=>BAG_UPGRADE[bagPages-1]||0,expandBag(){if(bagPages>=BAG_MAX_PAGES)return false;bagPages++;bagPage=bagPages-1;render();saveGame();return true;},
  combatMods,findBonus,coinBonus,skillRank,currentWeapon:()=>eq[cur],
  quickSlots:()=>QS.slice(),assignQuick(i,id){if(i<0||i>=5||!quickLearned(id))return false;const old=QS.indexOf(id);if(old>=0)QS[old]=null;QS[i]=id;syncQS();saveGame();return true;},
  dragDebug:()=>drag?{id:drag.id,from:drag.from,moved:drag.moved}:null,quickDropIndex,
  refresh(){syncHud();if($('char').classList.contains('on'))render();},
  bagFull:()=>bagFreeIndex()<0,
  bagItems:()=>bag.slice(0,bagLimit()).map((it,i)=>it?{i,it}:null).filter(Boolean),
  removeBagAt(i){
    if (i < 0 || i >= BAG || !bag[i]) return null;
    const it = bag[i]; bag[i] = null; pickSel = null; $('iinfo').classList.remove('on');
    if ($('char').classList.contains('on')) render();
    if (typeof saveGame === 'function') saveGame();
    return it;
  },
  isOpen: () => $('char').classList.contains('on'), close: closeChar,
};
// ---- 저장 (이 기기의 브라우저에 자동 저장: 금화·체력·레벨·가방·장비·물약·퀵슬롯) ----
const SKEY='sandrock_save_v3';
try{localStorage.removeItem('sandrock_save_v1');localStorage.removeItem('sandrock_save_v2');}catch(e){}
let RESETTING=false;
function saveGame(){
  if(RESETTING||window.ARPG_BACKUP_RESTORING||window.ARPG_SYNC_CHECKING)return;
  try{
    const P=G.P;
    localStorage.setItem(SKEY,JSON.stringify({v:3,gearSchema:TIER_MATCH.schema,t:Date.now(),name:P.name,stats:P.stats,mastery:P.mastery,skillLv:P.skillLv,passives:P.passives,lifeSkills:P.lifeSkills,
      statPts:P.statPts,skillPts:P.skillPts,lifePts:P.lifePts,portalReadyAt:P.portalReadyAt,reviveReadyAt:P.reviveReadyAt,reviveArmed:!!P.reviveArmed,reviveRank:P.reviveRank,gold:P.gold,hp:P.hp,mp:P.mp,lv:P.lv,exp:P.exp,bag,bagPages,bagPage,stash,eq,cur,pot:POT,scr:SCR,qs:QS,
      location:G.locationState?G.locationState():null,lastVisitedTown:G.lastVisitedTown?G.lastVisitedTown():null,
      telemetry:window.TELEMETRY?TELEMETRY.saveData():null,companion:window.COMPANION?COMPANION.saveData():null,
      trade:window.TRADE?TRADE.saveData():null,guild:window.GUILD?GUILD.saveData():null,quests:window.QUEST?QUEST.saveData():null}));
  }catch(e){}
}
function loadGame(){
  let d=null;try{d=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){}
  if(!d||d.v!==3)return null;
  bagPages=Math.max(1,Math.min(BAG_MAX_PAGES,d.bagPages|0||1));bagPage=Math.max(0,Math.min(bagPages-1,d.bagPage|0));
  for(let i=0;i<BAG;i++)bag[i]=d.bag&&d.bag[i]||null;
  for(let i=0;i<STASH;i++)stash[i]=d.stash&&d.stash[i]||null;
  for(const k in eq)eq[k]=d.eq&&d.eq[k]||null;
  cur=d.cur==='w2'&&eq.w2?'w2':'w1';
  if(d.pot){POT.hp=d.pot.hp|0;POT.mp=d.pot.mp|0;}
  if(d.scr){SCR.portal=Math.max(0,Math.min(SCR_MAX,d.scr.portal|0));SCR.ident=Math.max(0,Math.min(SCR_MAX,d.scr.ident|0));}
  if(d.qs)for(let i=0;i<5;i++)QS[i]=d.qs[i]&&(d.qs[i]==='townPortal'||A.skicon[d.qs[i]])?d.qs[i]:null;
  // unid 필드가 없는 이전 저장 장비는 falsy이므로 모두 감정 완료로 취급한다.
  let mx=0;for(const it of [...bag,...stash,...Object.values(eq)])if(it&&it.id>mx)mx=it.id;seq=mx+1;
  const P=G.P;P.name=d.name||P.name||'루시에라';P.lv=d.lv||1;P.exp=d.exp||0;P.statPts=d.statPts|0;P.skillPts=d.skillPts|0;P.lifePts=d.lifePts|0;
  P.stats=Object.assign({},P.stats,d.stats||{});P.mastery=Object.assign({},P.mastery,d.mastery||{});P.skillLv=Object.assign({},P.skillLv,d.skillLv||{});
  P.lifeSkills=Object.assign({},P.lifeSkills||{},d.lifeSkills||{});P.passives=Object.assign({},P.passives||{},d.passives||{});P.portalReadyAt=+d.portalReadyAt||0;P.reviveReadyAt=+d.reviveReadyAt||0;P.reviveArmed=!!d.reviveArmed;P.reviveRank=Math.max(1,Math.min(5,+d.reviveRank||1));
  if(G.syncLifeUnlocks)G.syncLifeUnlocks(true);G.setGold(d.gold|0);if(window.COMPANION)COMPANION.loadData(d.companion);if(window.TRADE)TRADE.loadData(d.trade);if(window.GUILD)GUILD.loadData(d.guild);if(window.QUEST)QUEST.loadData(d.quests);return d;
}
const saved=loadGame();
if(G.loadLastVisitedTown)G.loadLastVisitedTown(saved&&saved.lastVisitedTown||null);
if(window.TELEMETRY)TELEMETRY.loadData(saved&&saved.telemetry||null);
if(!saved&&window.TELEMETRY)TELEMETRY.enter(G.locationState());
// 테스트용: 구현된 액티브 스킬을 전부 배운 상태(1랭크)로 만든다(포인트는 건드리지 않음 — 저장 검사와 충돌). 정식 시작 전에 false로 바꿀 것.
const TEST_UNLOCK_ALL_SKILLS=false;
if(TEST_UNLOCK_ALL_SKILLS){for(const id of IMPLEMENTED)if(!((G.P.skillLv||{})[id]>0)){G.P.skillLv=G.P.skillLv||{};G.P.skillLv[id]=1;}}
syncHud();syncPot();
if(saved){
  G.P.hp=Math.max(1,Math.min(G.P.maxHp,saved.hp||G.P.maxHp));G.P.mp=Math.min(G.P.maxMp,saved.mp||0);G.setMax(G.P.maxHp,G.P.maxMp);
  Promise.resolve(G.resumeLocation?G.resumeLocation(saved.location):false).then(()=>{
    G.say('이어서 합니다. 금화 '+G.P.gold+'닢 그대로!');
  });
}
setInterval(saveGame,4000);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.UI.save=saveGame;window.UI.reset=()=>{RESETTING=true;try{localStorage.removeItem(SKEY);}catch(e){}location.reload();};
// 테스트용 초기화 버튼: 두 번 눌러야 지워진다. 정식 시작 전에 false로.
const TEST_RESET_BUTTON=true;
{const b=document.getElementById('resetBtn');
 if(b&&TEST_RESET_BUTTON){b.hidden=false;let armed=false,tm=0;
  b.addEventListener('click',()=>{if(!armed){armed=true;b.textContent='정말 지울까요?';tm=setTimeout(()=>{armed=false;b.textContent='초기화';},3500);}
   else{clearTimeout(tm);window.UI.reset();}});}}
})();
